# ============================================================
#  CustomSplash —— 自定义 Minecraft 启动界面
#  目标平台：Minecraft 26.1.2 + Fabric
# ============================================================
#  26.x 与 1.21.x 是两套完全不同的东西，所以这个项目是独立的，
#  不和 1.21.11 那份共用 build.gradle。详见 docs/PORTING-26x.md。
#
#  26.x 的三个关键差异：
#    1. 需要 Java 25（1.21.x 是 Java 21）
#    2. 需要 Gradle 9（Loom 1.14 起就不再支持 Gradle 8）
#    3. 游戏不再混淆，**没有 Yarn 映射**，直接用官方类名编译
# ============================================================

# ---- 目标 Minecraft / Fabric 版本 ----
minecraft_version=26.1.2
loader_version=0.19.5
fabric_version=0.155.3+26.1.2
# 注意：26.x 不需要 yarn_mappings 这一行。

# ---- 模组自身信息 ----
# mod_version 只写模组自己的语义化版本，不要写 MC 版本。
# 构建时会自动拼成 <mod_version>+<minecraft_version>，
# 于是产物叫 customsplash-<模组版本>+<MC 版本>.jar，
# tag 叫 v<模组版本>+<MC 版本>。
mod_version=1.0.4
maven_group=dev.customsplash
archives_base_name=customsplash

# ---- Gradle 构建参数 ----
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
