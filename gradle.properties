# ============================================================
#  CustomSplash —— 自定义 Minecraft 启动界面
# ============================================================
#  想换游戏版本时，只需要改下面这几行（其余代码一般不用动）。
#  已验证组合：1.21.11 + yarn 1.21.11+build.6 + loader 0.19.5
# ============================================================

# ---- 目标 Minecraft / Fabric 版本 ----
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11

# ---- 模组自身信息 ----
mod_version=1.0.0
maven_group=dev.customsplash
archives_base_name=customsplash

# ---- Gradle 构建参数 ----
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
