name: Build

# 每次推送到 main / 每个 PR 都构建一遍，确认没写坏。
# 产物会作为 workflow artifact 上传，方便下载来测试。

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: customsplash-${{ github.sha }}
          # build.gradle 没有 withSourcesJar()，这里只会匹配到模组主 jar
          path: build/libs/*.jar
          if-no-files-found: error
