name: Build

# 每次推送到 mc26 / 每个 PR 都构建一遍，确认没写坏。
# 产物会作为 workflow artifact 上传，方便下载来测试。
#
# 这条分支是 Minecraft 26.1.2 的代码，工具链和 main（1.21.11）**不一样**：
#   26.1.2 需要 JDK 25 + Gradle 9，1.21.11 只要 JDK 21 + Gradle 8。
#   改动这个文件前先看一眼 docs/PORTING-26x.md 里的版本矩阵。

on:
  push:
    branches: ["mc26"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 26.1.2 必须用 JDK 25 —— Loom 1.17 起就要求 25 了，21 会在配置阶段直接失败。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: customsplash-26.1.2-${{ github.sha }}
          # build.gradle 没有 withSourcesJar()，这里只会匹配到模组主 jar
          path: build/libs/*.jar
          if-no-files-found: error
